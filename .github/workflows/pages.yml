name: GitHub Pages

on:
  push:
    branches: [main, pages-preview-2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: ${{ github.event_name != 'push' }}
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Inspect output (preview only)
        run: |
          cd _site
          echo "::notice title=pages::$(find . -name index.html | sort | tr '\n' ' ')"
          for d in tk-latn tk-cyrl ur fa en; do
            f=$d/index.html
            echo "::notice title=$d::$(grep -o '<html[^>]*>' $f) h2=$(grep -c '<h2' $f) li=$(grep -c '<li>' $f) menu=$(grep -c 'hreflang=\"[^\"]*\" *$\|hreflang=\"[a-zA-Z-]*\"$' $f) nastaliq=$(grep -c Nastaliq $f) summary=$(grep -A3 '<summary>' $f | grep -o '<span[^<]*' | head -1)"
          done
          echo "::notice title=home::cards=$(grep -c '<li><a' index.html) h2=$(grep -c '<h2' index.html) summary=$(grep -A3 '<summary>' index.html | grep -o '<span[^<]*' | head -1)"
      - uses: actions/upload-pages-artifact@v4

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
