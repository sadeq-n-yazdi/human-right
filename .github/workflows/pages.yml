name: GitHub Pages

on:
  push:
    branches: [main, pages-preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Inspect output (preview only)
        run: |
          cd _site
          echo "::notice title=files::$(find . -name '*.html' | sort | tr '\n' ' ')"
          for l in fa en ar zh fr ru es; do
            echo "::notice title=$l::$(grep -o '<html[^>]*>' $l/index.html) $(grep -o '<title>[^<]*' $l/index.html) h2=$(grep -c '<h2' $l/index.html) nav=$(grep -c 'hreflang=\"' $l/index.html)"
          done
          echo "::notice title=home-links::$(grep -o 'href=\"[^\"]*\"' index.html | tr '\n' ' ' | cut -c1-900)"
          echo "::notice title=home-title::$(grep -o '<title>[^<]*' index.html) $(grep -o '<html[^>]*>' index.html)"
      - uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
